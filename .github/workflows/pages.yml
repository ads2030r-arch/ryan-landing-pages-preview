name: Deploy landing-page preview

on:
  push:
    branches: [main]
    paths:
      - 'ryan-landing-pages-preview-v1.2.0.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare static preview
        run: |
          rm -rf public
          mkdir -p public
          unzip -q ryan-landing-pages-preview-v1.2.0.zip -d public
          test -s public/index.html
          test -s public/robots.txt
          test -s public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
